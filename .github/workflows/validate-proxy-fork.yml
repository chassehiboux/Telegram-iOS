name: Validate proxy fork

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    name: Test HTTP CONNECT and compile device app
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select repository toolchain
        run: |
          set -euo pipefail
          required_xcode="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          required_macos="$(python3 -c 'import json; print(json.load(open("versions.json"))["macos"])')"
          xcode_path="/Applications/Xcode_${required_xcode}.app/Contents/Developer"

          [[ "$(uname -m)" == "arm64" ]] || { echo "An Apple Silicon runner is required." >&2; exit 1; }
          [[ "$(sw_vers -productVersion | cut -d. -f1)" == "$required_macos" ]] || exit 1
          [[ -d "$xcode_path" ]] || { echo "Required Xcode is unavailable at $xcode_path." >&2; exit 1; }
          sudo xcode-select -s "$xcode_path"
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2}')" == "$required_xcode" ]] || exit 1

      - name: Generate nonfunctional validation configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("build-system/appstore-configuration.json").read_text(encoding="utf-8"))
          config["api_id"] = "0"
          config["api_hash"] = "validation-only-not-a-real-api-hash"
          config["is_internal_build"] = "false"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["premium_iap_product_id"] = ""
          config["enable_siri"] = False
          config["enable_icloud"] = False
          destination = Path(os.environ["RUNNER_TEMP"]) / "telegram-proxy-validation.json"
          destination.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Import public placeholder signing certificate
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Run focused HTTP CONNECT tests
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_telegram_proxy_validation \
            test \
            --configurationPath="$RUNNER_TEMP/telegram-proxy-validation.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --target=//submodules/MtProtoKit:MtProtoKitProxyTests

      - name: Compile release device application
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_telegram_proxy_validation \
            build \
            --configurationPath="$RUNNER_TEMP/telegram-proxy-validation.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --outputBuildArtifactsPath="$RUNNER_TEMP/validation-build-artifacts"

          test -f "$RUNNER_TEMP/validation-build-artifacts/Telegram.ipa"
          echo "Validation IPA was compiled with nonfunctional placeholders and will not be uploaded."
