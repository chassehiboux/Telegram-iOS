name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" $OUTPUT_PATH/
          done

          # collect dsym
          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          release_name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: Telegram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: Telegram.DSYMs.zip
          asset_content_type: application/zip

  validate-proxy-fork:
    if: github.event_name == 'workflow_dispatch'
    name: Test HTTP CONNECT and compile device app
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select repository toolchain
        run: |
          set -euo pipefail
          required_xcode="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          required_macos="$(python3 -c 'import json; print(json.load(open("versions.json"))["macos"])')"
          xcode_path="/Applications/Xcode_${required_xcode}.app/Contents/Developer"

          [[ "$(uname -m)" == "arm64" ]] || { echo "An Apple Silicon runner is required." >&2; exit 1; }
          [[ "$(sw_vers -productVersion | cut -d. -f1)" == "$required_macos" ]] || exit 1
          [[ -d "$xcode_path" ]] || { echo "Required Xcode is unavailable at $xcode_path." >&2; exit 1; }
          sudo xcode-select -s "$xcode_path"
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2}')" == "$required_xcode" ]] || exit 1

      - name: Generate nonfunctional validation configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("build-system/appstore-configuration.json").read_text(encoding="utf-8"))
          config["api_id"] = "0"
          config["api_hash"] = "validation-only-not-a-real-api-hash"
          config["is_internal_build"] = "false"
          config["is_appstore_build"] = "false"
          config["appstore_id"] = "0"
          config["premium_iap_product_id"] = ""
          config["enable_siri"] = False
          config["enable_icloud"] = False
          destination = Path(os.environ["RUNNER_TEMP"]) / "telegram-proxy-validation.json"
          destination.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Import public placeholder signing certificate
        run: |
          set -euo pipefail
          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

      - name: Run focused HTTP CONNECT tests
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_telegram_proxy_validation \
            test \
            --configurationPath="$RUNNER_TEMP/telegram-proxy-validation.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --target=//submodules/MtProtoKit:MtProtoKitProxyTests

      - name: Compile release device application
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot=/private/var/tmp/_bazel_telegram_proxy_validation \
            build \
            --configurationPath="$RUNNER_TEMP/telegram-proxy-validation.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --outputBuildArtifactsPath="$RUNNER_TEMP/validation-build-artifacts"

          test -f "$RUNNER_TEMP/validation-build-artifacts/Telegram.ipa"
          echo "Validation IPA was compiled with nonfunctional placeholders and will not be uploaded."
